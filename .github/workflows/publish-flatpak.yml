name: Publish Flatpak

# Build/publish body lives in tuna-os/.github's reusable publish-flatpak.yml
# (tunaos#1183 recommendation #2). This file just keeps this repo's own
# trigger policy and the pinned runtime image.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    uses: tuna-os/.github/.github/workflows/publish-flatpak.yml@main
    with:
      app-id: org.tunaos.InstallerCosmic
      manifest-path: flatpak/org.tunaos.InstallerCosmic.json
      repo-name: tuna-os/tuna-installer-cosmic
      archs: '["x86_64"]'
      # Must track "runtime-version" in flatpak/org.tunaos.InstallerCosmic.json.
      # The tag only decides which runtime is preinstalled; the manifest
      # decides what is actually built against, so a mismatch silently costs
      # a full runtime download rather than failing. Also fixes the Rust
      # toolchain: org.freedesktop.Sdk.Extension.rust-stable//24.08 is frozen
      # at rustc 1.89.0, and libcosmic 1.0 / iced 0.14 / wgpu 28 declare
      # rust-version 1.93 / 1.92 / 1.92 -- what kept this job red for 17 runs.
      # //25.08 ships rustc 1.97.1.
      flatpak-builder-image: freedesktop-25.08
    secrets: inherit
