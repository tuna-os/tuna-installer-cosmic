name: Publish Flatpak
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-oci:
    name: Build Flatpak OCI
    runs-on: ubuntu-latest
    container:
      # Must track "runtime-version" in flatpak/org.tunaos.InstallerCosmic.json.
      # The tag only decides which runtime is preinstalled; the manifest decides
      # what is actually built against, so a mismatch silently costs a full
      # runtime download rather than failing.
      #
      # The branch also fixes the Rust toolchain: org.freedesktop.Sdk.Extension
      # .rust-stable//24.08 is frozen at rustc 1.89.0, and libcosmic 1.0 /
      # iced 0.14 / wgpu 28 declare rust-version 1.93 / 1.92 / 1.92. That is
      # what kept this job red for 17 runs. //25.08 ships rustc 1.97.1.
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/org.tunaos.InstallerCosmic.json
          cache-key: flatpak-builder-${{ github.sha }}
          build-bundle: false
          upload-artifact: false
      - name: Export OCI
        run: |
          flatpak build-bundle --oci --arch=x86_64 repo tuna-installer-cosmic.oci org.tunaos.InstallerCosmic
      - name: Upload OCI artifact
        uses: actions/upload-artifact@v7
        with:
          name: tuna-installer-cosmic-oci
          path: tuna-installer-cosmic.oci/
          retention-days: 1

  publish:
    name: Publish to GHCR
    needs: build-oci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: tuna-installer-cosmic-oci
          path: tuna-installer-cosmic.oci
      - name: Push OCI to GHCR
        run: |
          echo "${{ env.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          skopeo copy oci:tuna-installer-cosmic.oci docker://ghcr.io/tuna-os/tuna-installer-cosmic:latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update central index (tuna-os/docs)
        env:
          FLATPAK_INDEX_TOKEN: ${{ secrets.FLATPAK_INDEX_TOKEN }}
        run: |
          git clone --depth 1 \
            https://github.com/tuna-os/docs.git \
            index-repo
          # Use header-based auth so the token never lands in the remote URL
          # (avoids leaks via .git/config, `git remote -v`, and process listings).
          git -C index-repo config --local http.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FLATPAK_INDEX_TOKEN" | base64)"
          pip install requests
          python3 .github/scripts/update-index.py \
            --oci-dir tuna-installer-cosmic.oci \
            --index-file index-repo/static/flatpak/index/static \
            --repo-name tuna-os/tuna-installer-cosmic \
            --tags latest
          cd index-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/flatpak/index/static
          if git diff --cached --quiet; then
            echo "No index changes"
          else
            git commit -m "chore(flatpak): update tuna-installer-cosmic OCI index"
            git pull --rebase origin main
            git push origin main
          fi
