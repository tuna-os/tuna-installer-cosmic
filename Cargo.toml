[package]
name = "tuna-installer-cosmic"
version = "0.1.0"
edition = "2021"
description = "COSMIC (Iced/Rust) installer for TunaOS — drives fisherman bootc install backend"

[dependencies]
iced = { version = "0.13", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
