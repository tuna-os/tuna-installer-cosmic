# Lint config for this repo's Python sources. tuna-installer-cosmic is a
# Rust/libcosmic app, but .github/scripts/check-cargo-sources.py is real,
# maintained Python (the cargo-sources CI gate), so it gets a real linter
# rather than a placeholder file.
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "W"]
